# ============================================================
# MarketMind — Base Training Config
# All ablation yamls inherit from this file via OmegaConf merge.
# Edit here to change defaults across all runs.
# ============================================================

# --- Run identity ---
run_name: "base"  # overridden in each ablation yaml

# --- Model ---
model_name_or_path: "Qwen/Qwen3-8B"
trust_remote_code: true
torch_dtype: "bfloat16"

# --- Dataset ---
dataset_name: "FinGPT/fingpt-forecaster-dow30-202305-202312"
max_seq_length: 2048
test_split_size: 0.1
seed: 42

# --- Output ---
output_dir: "outputs/runs/${run_name}"
logging_dir: "outputs/logs/${run_name}"

# --- LoRA / PEFT ---
use_peft: true
lora_r: 32
lora_alpha: 64        # convention: 2x rank
lora_dropout: 0.05
lora_target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# --- Quantization (BitsAndBytes) ---
load_in_4bit: true
load_in_8bit: false
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_quant_type: "nf4"
bnb_4bit_use_double_quant: true

# --- Training hyperparameters ---
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8      # effective batch size = 16
learning_rate: 2.0e-4
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
optim: "paged_adamw_32bit"

# --- Efficiency ---
bf16: true
fp16: false
gradient_checkpointing: true
dataloader_num_workers: 4

# --- Logging / Checkpointing ---
logging_steps: 10
eval_steps: 50
save_steps: 100
save_total_limit: 2
load_best_model_at_end: true
report_to: "wandb"

# --- Classification head ablation (off by default) ---
use_cls_head: false
cls_lambda: 0.3
