run_name: "base"

model_name_or_path: "Qwen/Qwen3-8B"
trust_remote_code: true

dataset_name: "FinGPT/fingpt-forecaster-dow30-202305-202405"
max_seq_length: 4096
seed: 42

# --- Output ---
output_dir: "outputs/runs/${run_name}"
final_dir: "/data/user_data/yashagar/marketmind/${run_name}"
logging_dir: "outputs/logs/${run_name}"

# --- LoRA / PEFT ---
use_peft: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# --- Quantization (BitsAndBytes) ---
load_in_4bit: true
load_in_8bit: false
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_quant_type: "nf4"
bnb_4bit_use_double_quant: true

# --- Training hyperparameters ---
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: "cosine"
warmup_steps: 20        # replace warmup_ratio
weight_decay: 0.01
max_grad_norm: 1.0
optim: "paged_adamw_32bit"

# --- Efficiency ---
bf16: true
fp16: false
gradient_checkpointing: true
dataloader_num_workers: 4

logging_strategy: "steps"
logging_steps: 10
eval_strategy: "steps"
eval_steps: 50
save_strategy: "steps"
save_steps: 50

metric_for_best_model: "eval_cls_accuracy"
greater_is_better: true
save_total_limit: 2
load_best_model_at_end: true
report_to: "wandb"

cls_lambda: 0.1   # then sweep this